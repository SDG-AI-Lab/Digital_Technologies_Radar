[build]
  # This project deploys functions only. The React site remains on GitHub Pages
  # until its data client has been migrated to the API.
  command = "node -e \"console.log('API-only deployment')\""
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Applied if/when the SPA is also served from Netlify (GitHub Pages ignores this file;
# GH Pages relies on the CSP meta in public/index.html).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:8888 http://127.0.0.1:8888 https://undp-drr-radar-api.netlify.app https://*.supabase.co https://*.glitchtip.com https://*.cartocdn.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[dev]
  # Prevent local API tests from auto-starting the legacy React application.
  framework = "#static"
