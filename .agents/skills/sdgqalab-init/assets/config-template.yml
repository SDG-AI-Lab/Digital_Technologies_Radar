  #     - "**/__init__.py"
  #     - "**/manage.py"
  #     - "**/*settings*.py"
  #     - "**/wsgi.py"
  #     - "**/asgi.py"
  #     - "**/apps.py"
  #     - "**/urls.py"

  # ── Example: React/TypeScript frontend ──────────────────────────
  # frontend:
  #   type: react-typescript
  #   root: frontend/src/
  #   tech_tags:
  #     - react
  #     - typescript
  #     - vite
  #     - tailwind
  #   services:
  #     - nginx
  #
  #   quality_attribute_overrides:
