# .sdgqalab/config.yml — Generated by sdgqalab-init
# Edit freely. Re-run sdgqalab-init to regenerate from scratch.
version: 3

# Path to constitution file for project context (optional).
# constitution: .specify/memory/constitution.md

# ════════════════════════════════════════════════════════════════════
# PROJECT METADATA
# ════════════════════════════════════════════════════════════════════

project:
  name: "{PROJECT_NAME}"
  type: "{PROJECT_TYPE}"           # web-app, api, cli, mobile, ml-pipeline
  deployment_target: "{TARGET}"    # docker, kubernetes, serverless, bare-metal
  compliance: []                   # gdpr, soc2, hipaa, pci-dss (empty = none)

# ════════════════════════════════════════════════════════════════════
# STACK LAYERS
# ════════════════════════════════════════════════════════════════════
# Each layer is an independently auditable unit in the project.
# Discovered by sdgqalab-init — not preset. Used by BOTH the QA
# audit (quality attribute checks) and the coverage audit (test
# coverage analysis). Every project defines its own layers.
#
# Common patterns:
#   Full-stack web app:  frontend + backend
#   Full-stack with AI:  frontend + backend + ai-pipeline
#   API-only service:    api
#   Monorepo:            one layer per service/package
#   ML project:          data-pipeline + training + inference-api
#
# QA audit fields: type, root, tech_tags, services, quality_attribute_overrides
# Coverage audit fields: scopes, test_command, coverage_command,
#                         source_patterns, test_patterns, ignore
# ════════════════════════════════════════════════════════════════════

layers:

  # ── Example: Python/Django backend ──────────────────────────────
  # backend:
  #   type: python-django
  #   root: backend/
  #   tech_tags:
  #     - python
  #     - django
  #     - postgresql
  #     - redis
  #     - celery
  #   services:
  #     - postgresql
  #     - redis
  #     - celery
  #
  #   # — QA audit settings —
  #   quality_attribute_overrides:
  #     include: []
  #     exclude: []
  #
  #   # — Coverage audit settings —
  #   scopes:
  #     - accounts
  #     - audit
  #     - api
  #   test_command: >-
  #     docker compose exec -T backend python manage.py test {scopes}
  #   coverage_command: >-
  #     docker compose exec -T backend coverage run manage.py test {scopes}
  #     && docker compose exec -T backend coverage report --show-missing
  #   source_patterns:
  #     - "**/*.py"
  #   test_patterns:
  #     - "**/tests.py"
  #     - "**/test_*.py"
  #     - "**/tests/**/*.py"
  #   ignore:
  #     - "**/migrations/**"
