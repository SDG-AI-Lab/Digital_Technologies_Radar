# ════════════════════════════════════════════════════════════════════
# SEVERITY OVERRIDES (optional)
# ════════════════════════════════════════════════════════════════════
# Override default severity for specific QA audit check IDs.
#
# severity_overrides:
#   SEC-001: critical
#   DOC-015: low

severity_overrides: {}

# ════════════════════════════════════════════════════════════════════
# EXCLUDED CHECKS (optional)
# ════════════════════════════════════════════════════════════════════
# Skip specific QA audit check IDs entirely.
#
# excluded_checks:
#   - SAF-001
#   - FLX-020

excluded_checks: []
