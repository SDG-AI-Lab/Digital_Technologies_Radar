# .sdgqalab/config.yml — Generated by sdgqalab-init
# Edit freely. Re-run sdgqalab-init to regenerate from scratch.
version: 3

# Path to constitution file for project context (optional).
# constitution: .specify/memory/constitution.md

# ════════════════════════════════════════════════════════════════════
# PROJECT METADATA
# ════════════════════════════════════════════════════════════════════

project:
  name: "UNDP Digital Technologies Radar"
  type: "web-app"
  deployment_target: "github-pages+netlify+digital-ocean"
  compliance: []

# ════════════════════════════════════════════════════════════════════
# STACK LAYERS
# ════════════════════════════════════════════════════════════════════

layers:

  frontend:
    type: react-typescript
    root: src/
    tech_tags:
      - react
      - typescript
      - react-scripts
      - chakra-ui
      - mui
      - sass
      - react-router
      - leaflet
      - jest
      - cypress
      - any_web_framework
    services: []

    quality_attribute_overrides:
      include: []
      exclude: []

    scopes:
      - components
      - pages
      - helpers
      - radar
      - ui
      - layouts
      - navigation
    test_command: >-
      CI=true yarn test:unit --watchAll=false
    coverage_command: >-
      CI=true yarn test:unit --watchAll=false --coverage
    source_patterns:
      - "**/*.ts"
      - "**/*.tsx"
    test_patterns:
      - "**/*.test.ts"
      - "**/*.test.tsx"
    ignore:
      - "**/*.d.ts"
      - "**/setupTests.*"
      - "**/react-app-env*"
      - "**/reportWebVitals*"
      - "**/index.ts"
      - "**/types.ts"
      - "**/types/**"

  api:
    type: nodejs-netlify
    root: netlify/functions/
    tech_tags:
      - nodejs
      - netlify-functions
      - supabase
      - postgresql
      - any_api
      - any_database
    services:
      - supabase
      - postgresql

    quality_attribute_overrides:
      include: []
      exclude: []

    scopes:
      - api
    test_command: >-
      yarn test:api
    coverage_command: >-
      yarn test:api:coverage
    source_patterns:
      - "**/*.js"
    test_patterns:
      - "**/*.test.js"
      - "**/*.spec.js"
    ignore:
      - "**/node_modules/**"
      - "**/*.test.js"

# ════════════════════════════════════════════════════════════════════
# SEVERITY OVERRIDES (optional)
# ════════════════════════════════════════════════════════════════════

severity_overrides: {}

# ════════════════════════════════════════════════════════════════════
# EXCLUDED CHECKS (optional)
# ════════════════════════════════════════════════════════════════════

excluded_checks: []
