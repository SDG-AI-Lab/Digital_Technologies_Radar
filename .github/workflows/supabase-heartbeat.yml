name: Supabase Daily Heartbeat

on:
  schedule:
    # This runs at 12:00 PM UTC every day
    - cron: '0 12 * * *'

  # Optional: Allow manual triggering through GitHub UI
  workflow_dispatch:

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Check Supabase Status via Netlify API
        id: ping
        run: |
          echo "Pinging Netlify /api/health (queries Supabase) to prevent inactivity pause..."
          # Health endpoint uses SUPABASE_* from Netlify env — no keys in this workflow.
          RESPONSE=$(curl -s -o /tmp/heartbeat-body.txt -w "%{http_code}" \
            -X GET "https://undp-drr-radar-api.netlify.app/api/health")

          echo "HTTP Response Code: $RESPONSE"
          cat /tmp/heartbeat-body.txt || true
          echo

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "Supabase ping successful!"
          else
            echo "Supabase ping failed with response code: $RESPONSE"
            exit 1
          fi
